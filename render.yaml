services:
  - type: web
    name: ai-knowledge-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: AI_PROVIDER
        value: cloud

      - key: DATABASE_URL
        fromDatabase:
          name: ai-knowledge-db
          property: connectionString

      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ai-knowledge-frontend
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    autoDeploy: true

    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: ai-knowledge-db
    databaseName: aiknowledge
    user: aiknowledge
    plan: free
    region: frankfurt